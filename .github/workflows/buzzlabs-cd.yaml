# CD da Buzzlabs (NÃO é workflow upstream — não mesclar/rebasear com o element-web
# original). Todo commit na develop builda a imagem `element-grupos`, empurra para
# o registry privado e commita o bump da tag na main do repo Infra; o deploy em si
# é do ArgoCD (app `matrix-buzzlabs`, chat.buzzlabs.com.br).
#
# Roda em runner do GitHub, não no ARC do Hetzner: este repo é público e grupo de
# runner de organização não atende repositório público. Como o repo é público os
# minutos são gratuitos, o runner é maior que o pod do ARC (que tem 2 CPU / 8Gi) e
# o build não disputa CPU com o Jitsi no nó do Hetzner. O registry é alcançável
# pela internet (autenticado), então o push funciona daqui.
name: Buzzlabs CD

on:
    push:
        branches: [develop]
    workflow_dispatch: {}

# Coalesce para o commit mais novo, de propósito: o GitHub guarda no máximo UM run
# pendente por grupo, então se dois commits chegam durante um build em andamento só
# o último é buildado — os do meio não ganham imagem nem bump. Para um CD que
# publica a ponta da develop isso é o certo; quem quiser a imagem de um commit
# intermediário builda à mão. O que NÃO pode ser cancelado é o run em andamento
# (daí cancel-in-progress: false): cortar no meio deixaria imagem publicada sem o
# bump correspondente, e dois runs simultâneos disputariam o push na main do Infra.
concurrency:
    group: buzzlabs-cd
    cancel-in-progress: false

permissions: {}

env:
    IMAGE: docker.buzzlabs.com.br/element-grupos
    DEPLOYMENT: hetzner/k8s/matrix-buzzlabs/element-deployment.yaml

jobs:
    build-and-deploy:
        name: Build, push e bump no Infra
        runs-on: ubuntu-24.04
        # O workflow_dispatch aceita qualquer ref: sem esta guarda, um run manual a
        # partir de uma branch de feature buildaria aquele código e o deployaria em
        # chat.buzzlabs.com.br. Rodar de outra ref fica visível como job pulado.
        if: github.ref == 'refs/heads/develop'
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 1
                  persist-credentials: false

            # O scripts/docker-link-repos.sh linka o js-sdk `develop` quando o HEAD
            # está numa branch chamada `develop`, e isso quebra o build pelo pin do
            # pnpm. Em HEAD destacado ele não dispara.
            - name: Destacar o HEAD (evita o auto-link do js-sdk develop)
              run: git checkout --detach

            - name: Tag datada
              id: tag
              run: echo "tag=$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

            - name: Login no registry
              env:
                  REGISTRY_USER: ${{ vars.BUZZLABS_REGISTRY_USER }}
                  REGISTRY_PASSWORD: ${{ secrets.BUZZLABS_REGISTRY_PASSWORD }}
              run: echo "$REGISTRY_PASSWORD" | docker login docker.buzzlabs.com.br -u "$REGISTRY_USER" --password-stdin

            # Sem cache de propósito: o build a frio levou ~3min no job `Docker Buildx`
            # do PR #19, e cache de registry empurraria ~1-2GB por commit para o
            # Hetzner, cujo GC do registry já está pendente (ver hetzner/STATE.md).
            - name: Build e push
              env:
                  TAG: ${{ steps.tag.outputs.tag }}
              run: |
                  docker buildx create --use
                  docker buildx build --platform linux/amd64 \
                    -f apps/web/Dockerfile \
                    -t "$IMAGE:$TAG" --push .

            # Token escopado: só conteúdo, só o repo Infra. Sem isso o token herda
            # todas as permissões da instalação da App.
            - name: Token da GitHub App (escrita no Infra)
              id: app-token
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ vars.BUZZLABS_APP_ID }}
                  private-key: ${{ secrets.BUZZLABS_APP_PRIVATE_KEY }}
                  owner: Buzzlabs
                  repositories: Infra
                  permission-contents: write

            - name: Checkout do Infra
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  repository: Buzzlabs/Infra
                  token: ${{ steps.app-token.outputs.token }}
                  path: infra
                  # O push abaixo passa o token explicitamente — nada fica gravado
                  # no .git/config depois do checkout.
                  persist-credentials: false

            - name: Commit do bump na main
              working-directory: infra
              env:
                  TAG: ${{ steps.tag.outputs.tag }}
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  set -euo pipefail
                  yq -i ".spec.template.spec.containers[0].image = \"$IMAGE:$TAG\"" "$DEPLOYMENT"
                  git config user.name  "buzzlabs-ci[bot]"
                  git config user.email "ci@buzzlabs.com.br"
                  git commit -am "deploy(element): $TAG"
                  REMOTE="https://x-access-token:$GH_TOKEN@github.com/Buzzlabs/Infra.git"
                  # Outra automação pode ter commitado na main entre o checkout e aqui.
                  for _ in 1 2 3; do
                      git push "$REMOTE" HEAD:main && exit 0
                      git pull --rebase "$REMOTE" main
                  done
                  exit 1
