apiVersion: apps/v1
kind: Deployment
metadata:
  name: element
spec:
  replicas: 1
  selector:
    matchLabels:
      app: element
  template:
    metadata:
      labels:
        app: element
    spec:
      containers:
        - name: element
          image: element-grupos:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
